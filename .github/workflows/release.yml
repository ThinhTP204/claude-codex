# Push a tag like v0.2.0 (matching package.json "version") to build the desktop apps and publish a
# GitHub Release with them. Can also be started by hand from the Actions tab (then only artifacts).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash scripts/package-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: release/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inno Setup (if the runner image lacks it)
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: pwsh -ExecutionPolicy Bypass -File scripts/package-win.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.zip
            release/*-setup.exe

  # app code only (UI + server, no Node): what the in-app updater of installed apps downloads
  payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash scripts/package-payload.sh
      - uses: actions/upload-artifact@v4
        with:
          name: payload
          path: release/*.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows, payload]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the "## [x.y.z]" section of CHANGELOG.md becomes the release notes (the app shows them)
      - name: Release notes
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "- Phiên bản $V" > notes.md
          cat notes.md
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      # copies without the version in the name, so the site can link to
      # releases/latest/download/AgentDesk-mac-arm64.dmg and always get the newest build
      - name: Stable file names
        run: |
          cd dist-release
          for f in *; do
            s=$(echo "$f" | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+//')
            [ "$s" != "$f" ] && cp "$f" "$s"
          done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          name: AgentDesk ${{ github.ref_name }}
          body_path: notes.md
