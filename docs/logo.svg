<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- AgentDesk mark: a four-point AI spark carrying the three agent colours (Claude · Codex · Antigravity) -->
  <defs>
    <linearGradient id="ad-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d2a27"/><stop offset="1" stop-color="#0d0c0b"/></linearGradient>
    <radialGradient id="ad-halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#6E8BFF" stop-opacity=".38"/><stop offset="1" stop-color="#6E8BFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="ad-sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="ad-rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".4" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity=".08"/></linearGradient>
    <linearGradient id="ad-spark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB08F"/><stop offset=".5" stop-color="#5BE3B5"/><stop offset="1" stop-color="#6E8BFF"/></linearGradient>
    <radialGradient id="ad-core" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="ad-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="ad-clip"><rect width="256" height="256" rx="58"/></clipPath>
  </defs>
  <g clip-path="url(#ad-clip)">
    <rect width="256" height="256" fill="url(#ad-bg)"/>
    <circle cx="128" cy="132" r="120" fill="url(#ad-halo)"/>
    <path filter="url(#ad-glow)" fill="url(#ad-spark)" d="M128 38 C134 100 156 122 218 128 C156 134 134 156 128 218 C122 156 100 134 38 128 C100 122 122 100 128 38 Z"/>
    <circle cx="128" cy="128" r="30" fill="url(#ad-core)"/>
    <path fill="#FFB08F" opacity=".9" d="M196 52 C198 64 202 68 214 70 C202 72 198 76 196 88 C194 76 190 72 178 70 C190 68 194 64 196 52 Z"/>
    <path fill="#A9BBFF" opacity=".9" d="M62 172 C63.5 181 66.5 184 76 185.5 C66.5 187 63.5 190 62 199 C60.5 190 57.5 187 48 185.5 C57.5 184 60.5 181 62 172 Z"/>
    <rect width="256" height="128" fill="url(#ad-sheen)"/>
  </g>
  <rect x="1" y="1" width="254" height="254" rx="57" fill="none" stroke="url(#ad-rim)" stroke-width="2"/>
</svg>
